name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: python3 -m pip install pillow

      - run: python3 make_icons.py before

      - run: |
          mkdir -p www
          cp index.html style.css app.js setup.js setup.css manifest.json sw.js legal.html favicon.svg icon-*.png www/

      - run: |
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npm i @capacitor/filesystem@6 @capacitor/share@6
          npx cap init "ProjectMedia Y" com.projectmediay.app --web-dir www
          npx cap add android
          npx cap sync android

      - run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q RECORD_AUDIO "$M" || sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <application#' "$M"

      - run: python3 make_icons.py after

      - run: |
          SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --licenses > /dev/null || true
          "$SM" "platforms;android-34" "build-tools;34.0.0" || true

      - run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - run: cp android/app/build/outputs/apk/debug/app-debug.apk ProjectMedia-Y.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ProjectMedia-Y-apk
          path: ProjectMedia-Y.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ProjectMedia Y APK ${{ github.run_number }}
          files: ProjectMedia-Y.apk
