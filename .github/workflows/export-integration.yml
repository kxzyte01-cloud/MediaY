name: MediaY real export test

# Runs a real FFmpeg.wasm export (about 3 minutes) and inspects the MP4. Kept separate from the quick smoke tests
# because it downloads the 31 MB FFmpeg core from a CDN and depends on that network being reachable.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ffmpeg (used only to create test clips and inspect the output)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Playwright
        run: python -m pip install playwright
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Real export test
        run: python tests/export_integration.py
