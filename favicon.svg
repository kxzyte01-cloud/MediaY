<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
<title id="title">MediaY Neon Aperture</title><desc id="desc">A geometric cyan and white Y surrounding a violet camera aperture, with cyan and violet editing timeline bars.</desc>
<defs>
 <linearGradient id="cyan" x1="16" y1="10" x2="55" y2="100" gradientUnits="userSpaceOnUse"><stop stop-color="#12F1F4"/><stop offset="1" stop-color="#168BFF"/></linearGradient>
 <linearGradient id="violet" x1="50" y1="18" x2="108" y2="105" gradientUnits="userSpaceOnUse"><stop stop-color="#B58BFF"/><stop offset="1" stop-color="#713BDB"/></linearGradient>
 <linearGradient id="white" x1="70" y1="10" x2="111" y2="67" gradientUnits="userSpaceOnUse"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#C9D8F2"/></linearGradient>
 <linearGradient id="stem" x1="52" y1="74" x2="76" y2="120" gradientUnits="userSpaceOnUse"><stop stop-color="#25EAF3"/><stop offset="1" stop-color="#178DFF"/></linearGradient>
</defs>
<g stroke-linejoin="round">
 <!-- Y arms -->
 <path d="M13 12H34L54 45L45 58L27 37Z" fill="url(#cyan)"/>
 <path d="M115 12H94L74 45L83 58L101 37Z" fill="url(#white)"/>
 <!-- segmented left arm -->
 <path d="M21 25H37L42 32H25Z M29 38H45L49 45H33Z" fill="#071321" opacity=".9"/>
 <!-- Aperture ring and six blades -->
 <circle cx="64" cy="51" r="25" fill="#11112D" stroke="#8B5CF6" stroke-width="4"/>
 <circle cx="64" cy="51" r="19.5" fill="#0B1222" stroke="#20DDF4" stroke-width="1.5"/>
 <path d="M64 32L77 39L73 53L60 55L52 43Z" fill="#13DCEB"/>
 <path d="M77 39L83 52L73 64L65 54L73 53Z" fill="#8B5CF6"/>
 <path d="M83 52L77 66L62 70L64 56L73 64Z" fill="#6C43D5"/>
 <path d="M77 66L63 70L51 62L62 53L62 70Z" fill="#18A9FF"/>
 <path d="M51 62L45 49L52 36L62 48L62 53Z" fill="#22E5ED"/>
 <path d="M45 49L52 36L64 32L62 48L52 53Z" fill="#327CF5"/>
 <circle cx="64" cy="51" r="5" fill="#0A1220"/>
 <!-- Y stem -->
 <path d="M49 72L64 78L79 72L75 120H53Z" fill="url(#stem)"/>
 <path d="M64 78V119" stroke="#D8FFFF" stroke-width="2" opacity=".75"/>
 <!-- timeline/editing rails -->
 <path d="M9 91H43V98H9Z M9 104H43V108H9Z" fill="#10DDEB"/>
 <path d="M85 91H119V98H85Z M85 104H119V108H85Z" fill="#8B5CF6"/>
 <path d="M48 91H55V98H48Z M73 91H80V98H73Z" fill="#B58BFF"/>
</g>
</svg>